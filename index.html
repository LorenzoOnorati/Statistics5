<!DOCTYPE html>
<html lang="it">
<head> 
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Statistics Exercises</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #ffffff;
      color: #0f172a;
    }
  </style>
</head>
<body class="bg-white min-h-screen flex flex-col justify-between text-slate-800 antialiased">

  <!-- TOP HEADER DINAMICO (BREADCRUMB) -->
  <header class="py-5 px-4 sm:px-6 lg:px-8 border-b border-slate-100">
    <div class="max-w-3xl mx-auto flex items-center justify-between">
      <div id="breadcrumb-root" class="flex items-center space-x-2 text-sm">
        <h1 class="text-base font-bold text-slate-900 tracking-tight">Statistics Exercises</h1>
        <span class="text-xs font-medium text-slate-400">/ Root</span>
      </div>

      <nav id="breadcrumb-folder" class="hidden items-center space-x-2 text-sm">
        <button onclick="navigate('')" class="text-slate-400 hover:text-indigo-600 font-medium transition-colors flex items-center gap-1.5 cursor-pointer">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" />
          </svg>
          Statistics
        </button>
        <span class="text-slate-300">/</span>
        <span id="breadcrumb-current-folder" class="font-bold text-slate-900 flex items-center gap-1.5">
          <!-- Popolato dinamicamente -->
        </span>
      </nav>

      <span id="badge-count" class="hidden text-xs bg-slate-100 text-slate-500 px-2 py-0.5 rounded-full font-mono font-medium">
        <!-- Conteggio dinamico -->
      </span>
    </div>
  </header>

  <!-- CONTENITORE PRINCIPALE -->
  <main class="flex-1 max-w-3xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-10 flex flex-col justify-center">

    <!-- VISTA ROOT: ELENCO CARTELLE -->
    <div id="view-root" class="w-full space-y-4">

      <!-- CARTELLA HW5 -->
      <div 
        onclick="navigate('homework5')"
        class="w-full text-left group bg-white border border-slate-200 hover:border-indigo-300 rounded-2xl p-6 shadow-xs hover:shadow-md transition-all duration-200 flex items-center justify-between cursor-pointer focus:outline-none"
      >
        <div class="flex items-center space-x-4">
          <div class="w-12 h-12 rounded-xl bg-indigo-50 border border-indigo-100 flex items-center justify-center text-indigo-500 transition-transform duration-200 group-hover:scale-105">
            <svg class="w-6 h-6 fill-current" viewBox="0 0 20 20">
              <path d="M2 6a2 2 0 012-2h5l2 2h5a2 2 0 012 2v6a2 2 0 01-2 2H4a2 2 0 01-2-2V6z"></path>
            </svg>
          </div>
          <div>
            <div class="flex items-center space-x-2">
              <h2 class="text-base sm:text-lg font-semibold text-slate-900 group-hover:text-indigo-600 transition-colors">
                hw5
              </h2>
              <span class="text-xs bg-slate-100 text-slate-500 px-2 py-0.5 rounded-full font-mono font-medium">
                folder
              </span>
            </div>
            <p class="text-xs text-slate-400 mt-0.5 font-mono">
              1 item • Click to open
            </p>
          </div>
        </div>
        <div class="w-8 h-8 rounded-full bg-slate-50 group-hover:bg-indigo-50 flex items-center justify-center text-slate-400 group-hover:text-indigo-600 transition-colors">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
          </svg>
        </div>
      </div>

      <!-- CARTELLA HOMEWORK4 -->
      <div 
        onclick="navigate('homework4')"
        class="w-full text-left group bg-white border border-slate-200 hover:border-indigo-300 rounded-2xl p-6 shadow-xs hover:shadow-md transition-all duration-200 flex items-center justify-between cursor-pointer focus:outline-none"
      >
        <div class="flex items-center space-x-4">
          <div class="w-12 h-12 rounded-xl bg-amber-50 border border-amber-100 flex items-center justify-center text-amber-500 transition-transform duration-200 group-hover:scale-105">
            <svg class="w-6 h-6 fill-current" viewBox="0 0 20 20">
              <path d="M2 6a2 2 0 012-2h5l2 2h5a2 2 0 012 2v6a2 2 0 01-2 2H4a2 2 0 01-2-2V6z"></path>
            </svg>
          </div>
          <div>
            <div class="flex items-center space-x-2">
              <h2 class="text-base sm:text-lg font-semibold text-slate-900 group-hover:text-indigo-600 transition-colors">
                homework4
              </h2>
              <span class="text-xs bg-slate-100 text-slate-500 px-2 py-0.5 rounded-full font-mono font-medium">
                folder
              </span>
            </div>
            <p class="text-xs text-slate-400 mt-0.5 font-mono">
              2 items • Click to open
            </p>
          </div>
        </div>
        <div class="w-8 h-8 rounded-full bg-slate-50 group-hover:bg-indigo-50 flex items-center justify-center text-slate-400 group-hover:text-indigo-600 transition-colors">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
          </svg>
        </div>
      </div>

    </div>

    <!-- VISTA DENTRO HW5 -->
    <div id="view-homework5" class="hidden space-y-4">
      <a 
        href="./riemann_vs_lebesgue_integration.html"
        class="block bg-white rounded-xl border border-slate-200 hover:border-indigo-400 p-6 shadow-xs hover:shadow-md transition-all duration-200 group"
      >
        <div class="flex items-center justify-between">
          <div>
            <h2 class="text-base sm:text-lg font-semibold text-slate-900 group-hover:text-indigo-600 transition-colors">
              Riemann vs Lebesgue Integration
            </h2>
            <p class="text-xs text-slate-400 font-mono mt-1">
              Numerical quadrature, convergence and benchmark lab
            </p>
          </div>
          <svg class="w-5 h-5 text-slate-300 group-hover:text-indigo-600 group-hover:translate-x-1 transition-all" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
          </svg>
        </div>
      </a>
    </div>

    <!-- VISTA DENTRO HOMEWORK4 -->
    <div id="view-homework4" class="hidden space-y-4">
      <a 
        href="./exercise1_welford_streaming.html"
        class="block bg-white rounded-xl border border-slate-200 hover:border-indigo-400 p-6 shadow-xs hover:shadow-md transition-all duration-200 group"
      >
        <div class="flex items-center justify-between">
          <h2 class="text-base sm:text-lg font-semibold text-slate-900 group-hover:text-indigo-600 transition-colors">
            Ex 1: Welford Online Streaming Lab
          </h2>
          <svg class="w-5 h-5 text-slate-300 group-hover:text-indigo-600 group-hover:translate-x-1 transition-all" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
          </svg>
        </div>
      </a>

      <a 
        href="./exercise2_inferential_sampling.html"
        class="block bg-white rounded-xl border border-slate-200 hover:border-emerald-400 p-6 shadow-xs hover:shadow-md transition-all duration-200 group"
      >
        <div class="flex items-center justify-between">
          <h2 class="text-base sm:text-lg font-semibold text-slate-900 group-hover:text-emerald-600 transition-colors">
            Ex 2: Inferential Sampling & Multi-n Lab
          </h2>
          <svg class="w-5 h-5 text-slate-300 group-hover:text-emerald-600 group-hover:translate-x-1 transition-all" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
          </svg>
        </div>
      </a>
    </div>

  </main>

  <!-- FOOTER -->
  <footer class="py-4 text-center text-xs text-slate-400 border-t border-slate-100">
    Statistics Exercises
  </footer>

  <!-- ROUTING INTERNO -->
  <script>
    function renderView() {
      const hash = window.location.hash;
      const rootEl = document.getElementById('view-root');
      const hw4El = document.getElementById('view-homework4');
      const hw5El = document.getElementById('view-homework5');
      const bRoot = document.getElementById('breadcrumb-root');
      const bFolder = document.getElementById('breadcrumb-folder');
      const bCurrent = document.getElementById('breadcrumb-current-folder');
      const badge = document.getElementById('badge-count');

      // Reset iniziale di tutti i blocchi
      rootEl.classList.add('hidden');
      hw4El.classList.add('hidden');
      hw5El.classList.add('hidden');
      bRoot.classList.add('hidden');
      bFolder.classList.remove('flex');
      bFolder.classList.add('hidden');
      badge.classList.add('hidden');

      if (hash === '#homework5') {
        hw5El.classList.remove('hidden');
        bFolder.classList.remove('hidden');
        bFolder.classList.add('flex');
        bCurrent.innerHTML = `
          <svg class="w-4 h-4 text-indigo-500 fill-current" viewBox="0 0 20 20">
            <path d="M2 6a2 2 0 012-2h5l2 2h5a2 2 0 012 2v6a2 2 0 01-2 2H4a2 2 0 01-2-2V6z"></path>
          </svg>
          hw5
        `;
        badge.innerText = '1 exercise';
        badge.classList.remove('hidden');
      } else if (hash === '#homework4') {
        hw4El.classList.remove('hidden');
        bFolder.classList.remove('hidden');
        bFolder.classList.add('flex');
        bCurrent.innerHTML = `
          <svg class="w-4 h-4 text-amber-500 fill-current" viewBox="0 0 20 20">
            <path d="M2 6a2 2 0 012-2h5l2 2h5a2 2 0 012 2v6a2 2 0 01-2 2H4a2 2 0 01-2-2V6z"></path>
          </svg>
          homework4
        `;
        badge.innerText = '2 exercises';
        badge.classList.remove('hidden');
      } else {
        rootEl.classList.remove('hidden');
        bRoot.classList.remove('hidden');
      }
    }

    function navigate(destination) {
      window.location.hash = destination ? destination : '';
    }

    window.addEventListener('hashchange', renderView);
    window.addEventListener('DOMContentLoaded', renderView);
  </script>
</body>
</html>
